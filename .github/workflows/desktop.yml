# The desktop app's installers (desktop/), as artifacts of the run: .deb and
# .AppImage on Linux, .dmg (and .app) on macOS, .msi and the NSIS .exe on
# Windows. They contain only the shell: prigh itself is installed apart (on
# Windows inside WSL), see README.md, "Desktop app"; the Windows installers
# also carry prigh-computer.exe, the computer-use helper (desktop/computer),
# which the tool host in WSL runs through WSL's interop. Nix users get the app
# from the flake (packages.prigh-desktop, programs.prigh.desktop).
name: desktop

on:
  pull_request:
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
  push:
    branches: [main]
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: cargo test --locked -p prigh-desktop-core -p prigh-computer

      # The Windows backend on the runner's own desktop: Notepad must get
      # what the helper types.
      - name: Computer use on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked -p prigh-computer
          ./computer/test/windows.ps1 target/release/prigh-computer.exe

      # Tauri's externalBin (app/tauri.windows.conf.json) wants it named for
      # the target, and installs it next to prigh-desktop.exe.
      - name: Bundle prigh-computer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p app/binaries
          cp target/release/prigh-computer.exe "app/binaries/prigh-computer-$triple.exe"

      - name: Bundle
        working-directory: desktop/app
        run: npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }} -- --locked

      - uses: actions/upload-artifact@v4
        with:
          name: prigh-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/msi/*.msi
            desktop/target/release/bundle/nsis/*.exe
