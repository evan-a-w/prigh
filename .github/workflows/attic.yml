# Builds prigh, prigh-desktop and the Docker image's backend and frontend on
# every push to main and pushes them to the Attic cache `prigh`. Its API is
# only reachable over NetBird, so the runner joins the network first as an
# ephemeral peer. Pulls are public, from https://attic.caduc.co/prigh (the
# Docker build's backend and frontend have the same store paths as these).
#
# Secrets: NETBIRD_SETUP_KEY (reusable, ephemeral, auto-assigned to a group
# allowed TCP to the Attic API), ATTIC_ENDPOINT (the API endpoint, e.g.
# http://100.x.y.z:8765/), ATTIC_TOKEN (atticadm make-token --push prigh
# --pull prigh). Variable: NETBIRD_MANAGEMENT_URL when NetBird is self-hosted.
name: attic

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: attic
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-24.04
    if: github.repository == 'evan-a-w/prigh'
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Join NetBird
        uses: ankurk91/netbird-action@a2bfe6fd69eed50daa9387dfb3d86e5092f25557 # v2
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          management-url: ${{ vars.NETBIRD_MANAGEMENT_URL || 'https://api.netbird.io:443' }}

      - name: Log in to Attic
        env:
          ATTIC_ENDPOINT: ${{ secrets.ATTIC_ENDPOINT }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix profile install nixpkgs#attic-client
          attic login ci "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"

      # Paths are pushed as they are built, so a failed or cancelled build
      # still caches what it finished.
      - name: Build and push
        run: |
          attic watch-store ci:prigh &
          watcher=$!
          nix build --print-build-logs .#default .#prigh-desktop .#backend .#frontend
          attic push ci:prigh ./result*
          kill "$watcher"
