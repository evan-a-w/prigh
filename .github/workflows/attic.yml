# Builds prigh, everything it is built from and the dev shells on every push
# to main and pushes them to the Attic cache `prigh`, the flake's and the
# Docker build's substituter. Its API is only reachable over NetBird, so the
# runner joins the network first as an ephemeral peer. Pulls are public, from
# https://attic.caduc.co/prigh (the Docker build's backend and frontend have
# the same store paths as these).
#
# Secrets: NETBIRD_SETUP_KEY (reusable, ephemeral, auto-assigned to a group
# allowed TCP to the Attic API), ATTIC_ENDPOINT (the API endpoint, e.g.
# http://100.x.y.z:8765/), ATTIC_TOKEN (atticadm make-token --push prigh
# --pull prigh). Variable: NETBIRD_MANAGEMENT_URL when NetBird is self-hosted.
name: attic

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: attic
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-24.04
    if: github.repository == 'evan-a-w/prigh'
    # Compiling the OxCaml toolchains from scratch (after a dependency change)
    # takes hours on a runner.
    timeout-minutes: 360
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Join NetBird
        uses: ankurk91/netbird-action@a2bfe6fd69eed50daa9387dfb3d86e5092f25557 # v2
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          management-url: ${{ vars.NETBIRD_MANAGEMENT_URL || 'https://api.netbird.io:443' }}

      - name: Log in to Attic
        env:
          ATTIC_ENDPOINT: ${{ secrets.ATTIC_ENDPOINT }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix profile install nixpkgs#attic-client
          attic login ci "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"

      # Fails in a minute or two, not after the build, when the API cannot be
      # reached (the server or its NetBird peer down, its storage hung).
      - name: Check the Attic API
        run: |
          for attempt in 1 2 3; do
            if timeout 30 attic cache info ci:prigh; then exit 0; fi
            echo "Attic API not answering (attempt $attempt of 3)" >&2
            sleep 15
          done
          echo "::error::The Attic API at ATTIC_ENDPOINT does not answer: check atticd and its NetBird peer"
          exit 1

      # Everything a build or a dev shell needs: the packages, what they are
      # built from (inputDerivation: the OxCaml toolchains and packages, the
      # Rust crates) and the dev shells' inputs (a shell's own output is a stub
      # that references none of them). The watcher starts before evaluation,
      # which builds opam-nix's import-from-derivation results. Paths are
      # pushed as they are built, so a failed or cancelled run still caches
      # what it finished; paths on cache.nixos.org are skipped. Attic only
      # uploads what it lacks (and of that, only the chunks it lacks); targets
      # the cache already has are not built at all, so unchanged dependencies
      # are not even downloaded. The final push (the targets' closures) is
      # retried, since Attic skips what it already has. A watcher that died
      # fails the job afterwards: until then, nothing was pushed as it was
      # built, so a failed run would have cached nothing.
      - name: Build and push
        run: |
          attic watch-store ci:prigh &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true' EXIT
          targets=()
          for t in default prigh-desktop prigh-computer backend frontend \
            backend.inputDerivation frontend.inputDerivation \
            prigh-desktop-unwrapped.inputDerivation prigh-computer.inputDerivation \
            devShells.x86_64-linux.default.inputDerivation \
            devShells.x86_64-linux.desktop.inputDerivation; do
            out=$(nix eval --raw ".#$t.outPath")
            if nix path-info --store https://attic.caduc.co/prigh "$out" >/dev/null 2>&1; then
              echo "cached: $t"
            else
              targets+=(".#$t")
            fi
          done
          if [ ${#targets[@]} -gt 0 ]; then
            nix build --print-build-logs "${targets[@]}"
            for attempt in 1 2 3 4; do
              if attic push ci:prigh ./result*; then break; fi
              if [ "$attempt" = 4 ]; then
                echo "::error::attic push failed 4 times: check atticd and its storage"
                exit 1
              fi
              echo "attic push failed (attempt $attempt of 4), retrying in 60s" >&2
              sleep 60
            done
          fi
          if ! kill -0 "$watcher" 2>/dev/null; then
            status=0
            wait "$watcher" || status=$?
            echo "::error::attic watch-store exited early (status $status): paths were not pushed as they were built"
            exit 1
          fi
