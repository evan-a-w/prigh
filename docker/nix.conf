# Nix for the agents (see DOCKER.md, "Installing tools"). The /nix volume is
# shared by every user; nix-daemon (root) does all store writes.
experimental-features = nix-command flakes
build-users-group = nixbld
max-jobs = 4
# No CAP_SYS_ADMIN in the container: builds run as the nixbld users, without
# namespaces or seccomp.
sandbox = false
filter-syscalls = false
# Users are not trusted, so they cannot add substituters or keys.
trusted-users = root
substituters = https://cache.nixos.org/
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
ssl-cert-file = /etc/ssl/certs/ca-certificates.crt
# Collect garbage while building when less than 2 GiB is free, up to 8 GiB.
min-free = 2147483648
max-free = 8589934592
# nixpkgs is the revision in prigh's flake.lock (generated at build time), so
# every user evaluates the same nixpkgs and shares its cached results.
flake-registry = /etc/nix/flake-registry.json
