<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>prigh</title>
  <!-- Installable (sw.js, manifest.webmanifest). The manifest is fetched
       with credentials, for a proxy that signs users in in front of it. -->
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <meta name="theme-color" content="#1b1e23">
  <link id="favicon" rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="prigh">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <script>
    // The theme the page last showed, before the first paint
    // (app/pref_cache.ml); the backend's arrives later.
    try {
      const theme = JSON.parse(localStorage.getItem("prigh-web.theme"));
      const root = document.documentElement;
      for (const [k, v] of Object.entries(theme?.attrs ?? {})) root.setAttribute(k, v);
      for (const [k, v] of Object.entries(theme?.vars ?? {})) root.style.setProperty(k, v);
    } catch (e) {}
  </script>
  <script>
    // Core's time zones need Temporal: a polyfill where the browser has none
    // (e.g. WebKitGTK), before main.bc.js. Above the stylesheet, which an
    // inline script would wait for.
    if (typeof Temporal === "undefined") document.write('<script src="temporal-polyfill.js"><\/script>');
  </script>
  <!-- The build (site/dune) names these as NAME?v=VERSION. The sans font
       is what the first screen shows: fetched with the stylesheet rather
       than once it is parsed. -->
  <link rel="preload" href="recursive-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
  <script defer src="main.bc.js"></script>
</head>
<body>
  <div id="app"><div class="loading">connecting…</div></div>
</body>
</html>
