<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>prigh</title>
  <!-- Installable (sw.js, manifest.webmanifest). The manifest is fetched
       with credentials, for a proxy that signs users in in front of it. -->
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <meta name="theme-color" content="#1b1e23">
  <link id="favicon" rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="prigh">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <script>
    // The theme the page last showed, before the first paint
    // (app/pref_cache.ml); the backend's arrives later.
    try {
      const theme = JSON.parse(localStorage.getItem("prigh-web.theme"));
      const root = document.documentElement;
      for (const [k, v] of Object.entries(theme?.attrs ?? {})) root.setAttribute(k, v);
      for (const [k, v] of Object.entries(theme?.vars ?? {})) root.style.setProperty(k, v);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chat.css">
  <link rel="stylesheet" href="agents.css">
  <link rel="stylesheet" href="terminal.css">
  <link rel="stylesheet" href="files.css">
  <link rel="stylesheet" href="review.css">
  <link rel="stylesheet" href="highlight.css">
  <link rel="stylesheet" href="resize.css">
  <link rel="stylesheet" href="paging.css">
  <link rel="stylesheet" href="jump.css">
  <link rel="stylesheet" href="forge.css">
</head>
<body>
  <div id="app"><div class="loading">connecting…</div></div>
  <script src="main.bc.js"></script>
</body>
</html>
